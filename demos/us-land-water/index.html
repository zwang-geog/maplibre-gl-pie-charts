<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>US county land and water</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css">
    <style>
        html, body, #map { height: 100%; margin: 0; }
        #panel {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 1;
            width: 220px;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.94);
            border-radius: 6px;
            font: 13px/1.4 sans-serif;
            color: #1c1c1c;
        }
        #panel h1 { margin: 0 0 8px; font-size: 15px; }
        #status { margin: 8px 0 0; color: #555; }
        .key { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
        .swatch { width: 12px; height: 12px; border-radius: 2px; }
    </style>
    <script type="importmap">
    {
        "imports": {
            "flatgeobuf/generic": "https://cdn.jsdelivr.net/npm/flatgeobuf@4.6.1/dist/esm/generic.js",
            "flatbuffers": "https://cdn.jsdelivr.net/npm/flatbuffers@25.9.23/+esm",
            "slice-source": "https://cdn.jsdelivr.net/npm/slice-source@0.4.1/+esm",
            "@repeaterjs/repeater": "https://cdn.jsdelivr.net/npm/@repeaterjs/repeater@3.1.0/+esm"
        }
    }
    </script>
</head>
<body>
    <div id="map"></div>
    <aside id="panel">
        <h1>County land and water</h1>
        <div class="key"><span class="swatch" style="background:#7d9a3a"></span>aland</div>
        <div class="key"><span class="swatch" style="background:#4f8fba"></span>awater</div>
        <p id="status">Loading charts…</p>
    </aside>
    <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js"></script>
    <script type="module">
        import {PieChartLayer} from '../../src/index.js';

        const status = document.getElementById('status');
        const style = await fetch('https://tiles.openfreemap.org/styles/positron').then((response) => {
            if (!response.ok) throw new Error(`Failed to fetch basemap style: ${response.status}`);
            return response.json();
        });
        showCountyBoundaries(style);

        const map = new maplibregl.Map({
            container: 'map',
            style,
            center: [-98.5, 39.5],
            zoom: 3.6,
        });
        map.addControl(new maplibregl.NavigationControl(), 'top-right');

        const pies = new PieChartLayer({
            id: 'land-water',
            url: './tl_2025_us_county_points.fgb',
            slices: ['aland', 'awater'],
            colors: ['#7d9a3a', '#4f8fba'],
            radius: {
                steps: [
                    [1_000_000_000, 5],
                    [2_500_000_000, 8],
                    [6_000_000_000, 12],
                    [20_000_000_000, 16],
                ],
                fallback: 20,
            },
            opacity: 0.92,
            hole: 0.5
        });

        function showCountyBoundaries(style) {
            const boundaries = style.layers.find((layer) => layer.id === 'boundary_3');
            const levelRange = boundaries.filter.find((clause) => clause[0] === '<=' && clause[2] === 6);
            levelRange[0] = '<';
            boundaries.minzoom = 4;

            const insertAt = style.layers.indexOf(boundaries) + 1;
            style.layers.splice(insertAt, 0, {
                id: 'boundary_county',
                type: 'line',
                source: boundaries.source,
                'source-layer': boundaries['source-layer'],
                minzoom: 3,
                filter: [
                    'all',
                    ['==', ['get', 'admin_level'], 6],
                    ['!=', ['get', 'maritime'], 1],
                    ['!=', ['get', 'disputed'], 1],
                    ['!', ['has', 'claimed_by']],
                ],
                layout: {'line-cap': 'round', 'line-join': 'round'},
                paint: {
                    'line-color': '#cc3300',
                    'line-width': ['interpolate', ['linear'], ['zoom'], 7, 3, 11, 4],
                },
            });
        }

        map.on('load', () => {
            map.addLayer(pies);
            pies.loaded.then(() => {
                status.textContent = `${pies.count.toLocaleString()} counties`;
            }).catch((error) => {
                status.textContent = error.message;
            });
        });
    </script>
</body>
</html>

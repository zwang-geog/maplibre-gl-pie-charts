<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Educational attainment - maplibre-gl-pie-charts demo</title>
    <meta name="description" content="Map of educational attainment for the US population age 25 and older. Each county is a donut chart drawn by the maplibre-gl-pie-charts layer on MapLibre GL JS.">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css">
    <style>
        html, body, #map { height: 100%; margin: 0; }
        #panel {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 1;
            width: 230px;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.94);
            border-radius: 6px;
            font: 13px/1.4 sans-serif;
            color: #1c1c1c;
        }
        #panel h1 { margin: 0 0 2px; font-size: 15px; }
        #panel p { margin: 0; }
        #note { color: #555; font-size: 12px; }
        #status { margin: 8px 0 0; color: #555; }
        .key { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
        .swatch { width: 12px; height: 12px; border-radius: 2px; }
    </style>
    <script type="importmap">
    {
        "imports": {
            "hyparquet": "https://cdn.jsdelivr.net/npm/hyparquet@1.33.0/src/index.js",
            "hyparquet-compressors": "https://cdn.jsdelivr.net/npm/hyparquet-compressors@1.1.3/src/index.js",
            "fzstd": "https://cdn.jsdelivr.net/npm/fzstd@0.1.1/esm/index.mjs",
            "hysnappy": "https://cdn.jsdelivr.net/npm/hysnappy@1.1.1/js/index.js"
        }
    }
    </script>
</head>
<body>
    <div id="map"></div>
    <aside id="panel">
        <h1>Educational attainment</h1>
        <p id="note">Population age 25 and older</p>
        <div class="key"><span class="swatch" style="background:#c4533a"></span>No high school diploma</div>
        <div class="key"><span class="swatch" style="background:#e09a3e"></span>High school</div>
        <div class="key"><span class="swatch" style="background:#3d8ea6"></span>Some college</div>
        <div class="key"><span class="swatch" style="background:#5c8f3a"></span>Bachelor's degree</div>
        <div class="key"><span class="swatch" style="background:#5b4d8a"></span>Graduate degree</div>
        <p id="status">Loading charts…</p>
    </aside>
    <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js"></script>
    <script type="module">
        import {PieChartLayer} from 'https://cdn.jsdelivr.net/npm/maplibre-gl-pie-charts@0.1.0/dist/index.mjs';

        const status = document.getElementById('status');
        const style = await fetch('https://tiles.openfreemap.org/styles/positron').then((response) => {
            if (!response.ok) throw new Error(`Failed to fetch basemap style: ${response.status}`);
            return response.json();
        });
        showCountyBoundaries(style);

        const map = new maplibregl.Map({
            container: 'map',
            style,
            center: [-98.5, 39.5],
            zoom: 3.6,
        });
        map.addControl(new maplibregl.NavigationControl(), 'top-right');

        const pies = new PieChartLayer({
            id: 'education',
            url: './tl_2025_us_county_points.parquet',
            slices: ['below_hs', 'high_school', 'some_college', 'bachelors', 'graduate'],
            colors: ['#c4533a', '#e09a3e', '#3d8ea6', '#5c8f3a', '#5b4d8a'],
            radius: {
                steps: [
                    [8000, 6],
                    [20000, 9],
                    [50000, 13],
                    [150000, 17],
                ],
                fallback: 22,
            },
            opacity: 0.92,
            hole: 0.5,
        });

        function showCountyBoundaries(style) {
            const boundaries = style.layers.find((layer) => layer.id === 'boundary_3');
            const levelRange = boundaries.filter.find((clause) => clause[0] === '<=' && clause[2] === 6);
            levelRange[0] = '<';
            boundaries.minzoom = 4;

            const insertAt = style.layers.indexOf(boundaries) + 1;
            style.layers.splice(insertAt, 0, {
                id: 'boundary_county',
                type: 'line',
                source: boundaries.source,
                'source-layer': boundaries['source-layer'],
                minzoom: 3,
                filter: [
                    'all',
                    ['==', ['get', 'admin_level'], 6],
                    ['!=', ['get', 'maritime'], 1],
                    ['!=', ['get', 'disputed'], 1],
                    ['!', ['has', 'claimed_by']],
                ],
                layout: {'line-cap': 'round', 'line-join': 'round'},
                paint: {
                    'line-color': '#cc3300',
                    'line-width': ['interpolate', ['linear'], ['zoom'], 7, 3, 11, 4],
                },
            });
        }

        map.on('load', () => {
            map.addLayer(pies);
            pies.loaded.then(() => {
                status.textContent = `${pies.count.toLocaleString()} counties`;
            }).catch((error) => {
                status.textContent = error.message;
            });
        });
    </script>
</body>
</html>
